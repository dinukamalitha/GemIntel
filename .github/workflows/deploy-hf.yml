name: Sync to Hugging Face Spaces

on:
  push:
    branches: [hf-deploy]
    paths:
      - 'backend/**' # Only trigger if files in backend folder change

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Download LFS files if any exist on GitHub

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git author info
          git config --global user.email "deploy-action@github.com"
          git config --global user.name "GitHub Deploy Action"
          
          # Configure credential helper for Hugging Face (so Git LFS can authenticate)
          git config --global credential.helper store
          echo "https://AcHa99:$HF_TOKEN@huggingface.co" > ~/.git-credentials
          
          # Navigate to backend directory and initialize temporary git repository
          cd backend
          git init
          git checkout -b main
          
          # Configure Git LFS in the temporary repo so Hugging Face accepts large models
          git lfs install
          git lfs track "*.pth"
          git lfs track "*.pt"
          git lfs track "*.pkl"
          git lfs track "*.joblib"
          git lfs track "*.onnx"
          git lfs track "*.bin"
          git add .gitattributes
          
          # Add and commit backend files
          git add .
          git commit -m "Sync from GitHub Action [skip ci]"
          
          # Force push to the Hugging Face Space repository
          git push -f https://AcHa99:$HF_TOKEN@huggingface.co/spaces/AcHa99/gemintel-api main
